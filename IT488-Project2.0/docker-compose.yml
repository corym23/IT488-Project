version: '3.8'
services:
  api:
    build: ./server/web-api
    ports:
      - "4000:4000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: http://api:4000
    ports:
      - "5173:80" # mapped to 5173 for compatibility with existing tests
    depends_on:
      - api
    restart: unless-stopped

  core:
    build: ./server/ATS_Application_Main
    ports:
      - "8080:80"
    restart: unless-stopped
